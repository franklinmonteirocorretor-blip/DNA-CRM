services:
  whatsapp-gateway:
    build:
      context: ../../apps/whatsapp-gateway
    image: monteiro-whatsapp-gateway:local
    restart: unless-stopped
    init: true
    env_file:
      - ${WHATSAPP_GATEWAY_ENV_FILE:-/etc/monteiro/whatsapp-gateway.env}
    environment:
      PORT: "10000"
      WHATSAPP_REAL_OUTBOUND_ENABLED: "false"
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||10000)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      whatsapp-gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
