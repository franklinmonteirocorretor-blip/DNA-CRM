services:
  whatsapp-gateway:
    build:
      context: ./apps/whatsapp-gateway
    image: monteiro-whatsapp-gateway:local
    restart: unless-stopped
    init: true
    env_file:
      - ${WHATSAPP_GATEWAY_ENV_FILE:-/etc/monteiro/whatsapp-gateway.env}
    environment:
      PORT: "10000"
      WHATSAPP_REAL_OUTBOUND_ENABLED: "false"
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
